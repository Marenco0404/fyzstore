<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Agregar Descuentos de Prueba</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .section {
            margin: 30px 0;
        }
        
        .section h2 {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ee5a52;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .product-list {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .product-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 3px;
            border-left: 3px solid #667eea;
        }
        
        .product-name {
            font-weight: bold;
            color: #333;
        }
        
        .product-info {
            font-size: 0.85em;
            color: #666;
            margin-top: 3px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Admin - Gestor de Descuentos</h1>
        <p class="subtitle">Herramienta para agregar y gestionar descuentos en productos</p>
        
        <div class="section">
            <h2>📊 Acciones Rápidas</h2>
            <div class="button-group">
                <button class="btn-primary" onclick="agregarDescuentosPrueba()">
                    ➕ Agregar Descuentos de Prueba
                </button>
                <button class="btn-secondary" onclick="listarProductosDescuento()">
                    📋 Listar Descuentos
                </button>
                <button class="btn-danger" onclick="eliminarTodosDescuentos()">
                    🗑️ Eliminar Todos
                </button>
            </div>
        </div>
        
        <div class="section">
            <h2>🎁 Agregar Descuento Manual</h2>
            <div class="input-group">
                <input type="text" id="productId" placeholder="ID del Producto">
                <input type="number" id="descuentoValue" placeholder="% Descuento" min="1" max="100">
            </div>
            <button class="btn-primary" onclick="agregarDescuentoManual()">Agregar Descuento</button>
        </div>
        
        <div id="status"></div>
        
        <div class="section">
            <h2>📦 Productos con Descuento</h2>
            <div id="productList" class="product-list">
                <p style="color: #999;">Haz clic en "Listar Descuentos" para ver los productos</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Config -->
    <script src="js/firebase-config.js"></script>

    <script>
        function showStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            let spinner = '';
            if (type === 'loading') {
                spinner = '<div class="spinner"></div>';
            }
            statusDiv.innerHTML = `<div class="status ${type}">${spinner}${message}</div>`;
        }
        
        async function agregarDescuentosPrueba() {
            showStatus('Agregando descuentos de prueba...', 'loading');
            
            try {
                // Obtener algunos productos
                const snapshot = await db.collection('productos').limit(5).get();
                let count = 0;
                
                const descuentos = [15, 20, 25, 30, 10];
                let idx = 0;
                
                for (const doc of snapshot.docs) {
                    const descuento = descuentos[idx % descuentos.length];
                    
                    await db.collection('productos').doc(doc.id).update({
                        descuento: descuento
                    });
                    
                    console.log(`✅ Descuento de ${descuento}% agregado a ${doc.data().nombre}`);
                    count++;
                    idx++;
                }
                
                showStatus(`✅ ${count} productos actualizados con descuentos de prueba`, 'success');
                listarProductosDescuento();
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function listarProductosDescuento() {
            showStatus('Cargando productos con descuento...', 'loading');
            
            try {
                const snapshot = await db.collection('productos')
                    .where('descuento', '>', 0)
                    .limit(20)
                    .get();
                
                if (snapshot.empty) {
                    document.getElementById('productList').innerHTML = '<p style="color: #ff6b6b;">❌ No hay productos con descuento</p>';
                    showStatus('No hay productos con descuento en la base de datos', 'error');
                    return;
                }
                
                const productosHtml = snapshot.docs.map(doc => {
                    const data = doc.data();
                    const precioOriginal = data.precio || 0;
                    const precioDescuento = precioOriginal * (1 - (data.descuento || 0) / 100);
                    
                    return `
                        <div class="product-item">
                            <div class="product-name">${data.nombre || 'Sin nombre'}</div>
                            <div class="product-info">
                                ID: ${doc.id}<br>
                                Descuento: <strong>${data.descuento}%</strong><br>
                                Precio: ₡${precioOriginal.toFixed(0)} → ₡${precioDescuento.toFixed(0)}
                            </div>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('productList').innerHTML = productosHtml;
                showStatus(`✅ ${snapshot.size} productos encontrados con descuento`, 'success');
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function agregarDescuentoManual() {
            const productId = document.getElementById('productId').value;
            const descuentoValue = parseInt(document.getElementById('descuentoValue').value);
            
            if (!productId || !descuentoValue || descuentoValue < 1 || descuentoValue > 100) {
                showStatus('❌ Ingresa un ID de producto válido y un descuento entre 1-100', 'error');
                return;
            }
            
            showStatus('Actualizando producto...', 'loading');
            
            try {
                await db.collection('productos').doc(productId).update({
                    descuento: descuentoValue
                });
                
                showStatus(`✅ Descuento de ${descuentoValue}% agregado al producto`, 'success');
                document.getElementById('productId').value = '';
                document.getElementById('descuentoValue').value = '';
                listarProductosDescuento();
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function eliminarTodosDescuentos() {
            if (!confirm('⚠️ ¿Seguro que quieres eliminar TODOS los descuentos?')) {
                return;
            }
            
            showStatus('Eliminando descuentos...', 'loading');
            
            try {
                const snapshot = await db.collection('productos')
                    .where('descuento', '>', 0)
                    .limit(500)
                    .get();
                
                let count = 0;
                for (const doc of snapshot.docs) {
                    await db.collection('productos').doc(doc.id).update({
                        descuento: null
                    });
                    count++;
                }
                
                showStatus(`✅ ${count} descuentos eliminados`, 'success');
                document.getElementById('productList').innerHTML = '<p style="color: #999;">No hay productos con descuento</p>';
                
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
